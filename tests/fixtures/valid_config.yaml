app:
  app_name: TestTopology
  project_root: "/tmp/test_project"
  models_path: "/tmp/test_models"
  active_model: "moondream2"

families:
  allowed_families:
    - table_family
    - lamp_family

geometry:
  build_volume:
    x: 250
    y: 250
    z: 350
  bounds:
    min_width: 100
    max_width: 1500
    min_depth: 100
    max_depth: 1500
    min_height: 50
    max_height: 2000
  material_default: "wood"

ea:
  population_count: 30
  islands_per_league: 2
  league_count: 2
  candidates_per_generation: 10
  review_every_n_generations: 3
  top_k_selection_count: 3
  pairwise_tiebreak_count: 2

scoring:
  physics_gate_threshold: 0.3
  aesthetic_weight: 0.4
  physics_weight: 0.3
  novelty_weight: 0.2
  taste_weight: 0.1

logging:
  log_level: "DEBUG"
  log_dir: "/tmp/test_logs"
